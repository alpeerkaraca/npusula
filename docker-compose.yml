# NPusula production stack: vector store, LLM runtime, and the API.
#
#   docker compose up -d --build          # qdrant + ollama (+ model pull) + api
#   docker compose --profile tools run --rm trainer   # one-time data/model build
#
# The processed dataset (./data) and model artifacts (./artifacts) are
# bind-mounted into the containers; build them on the host or via the
# `trainer` profile before serving traffic.
name: npusula

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships bash but no curl; TCP probe on the REST port.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Pulls the configured Gemma model once the LLM runtime is healthy.
  # Until it finishes, LLM-assisted paths degrade to their deterministic
  # fallbacks (topic judge, explanations) without blocking the API.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${GEMMA_MODEL_NAME:-gemma4:e4b}"]
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      # Network addresses stay pinned to the compose network: the host-side
      # .env points at 127.0.0.1, which is wrong inside a container.
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      GEMMA_API_URL: http://ollama:11434
      # These are container-agnostic, so .env (or the shell) supplies them.
      GEMMA_MODEL_NAME: ${GEMMA_MODEL_NAME:-gemma4:e4b}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Set to 1 for an offline demo once ./models is populated.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      # CLIP weights for uploaded-media analysis (never baked into the image).
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-time pipeline: normalize raw dataset -> rebuild Qdrant index -> train
  # the popularity model. Runs inside the same image (torch included).
  trainer:
    build: .
    profiles: ["tools"]
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./models:/app/models
    entrypoint: ["/bin/bash", "-c"]
    # Full two-layer rebuild, in the order the pipeline requires: normalize ->
    # validation-only tuning -> Layer A -> Layer B -> locked final test ->
    # retrieval index. The test split is read only by evaluate_final.py.
    command: ["python scripts/02_normalize_smp.py && python scripts/tune_lgbm.py && python scripts/05_train_lgbm.py && python scripts/06_time_lift.py && python scripts/evaluate_final.py && python scripts/07_index_qdrant.py"]

volumes:
  qdrant_storage:
  ollama_models:
